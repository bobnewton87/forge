<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Body3D Harness</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/body3d.css">
<style>
  body { padding: 16px; }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  .stats { font: 12px ui-monospace, monospace; color: var(--muted); margin: 8px 0; min-height: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 12px; }
  label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  label b { color: var(--text); font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .sec { grid-column: 1 / -1; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent2); margin-top: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .row button { padding: 8px 12px; border-radius: 10px; background: var(--card2); border: 1px solid var(--line); font-size: 13px; }
  #fallback { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Body3D harness</h1>
  <div id="mount"></div>
  <div id="fallback"></div>
  <div class="stats" id="stats"></div>
  <div class="row">
    <button id="ghost">Toggle "now" ghost</button>
    <button id="auto">Toggle auto-rotate</button>
    <button id="front">Front</button><button id="q34">3/4</button><button id="side">Side</button><button id="back">Back</button>
  </div>
  <div class="grid" id="ctl"></div>
</div>
<script type="module">
import { mountBody3D, supported, POSES } from '../js/ui/body3d-sdf.js';
import { silhouetteSVG } from '../js/ui/silhouette.js';

const state = {
  bodyFatPct: 15,
  shape: { neck: 15, shoulders: 46, chest: 39, waist: 33, hips: 37, arm: 13, forearm: 11, thigh: 22, calf: 14.5, heightIn: 69 },
  muscle: { chest: 0.4, delts: 0.4, lats: 0.4, arms: 0.4, abs: 0.4, quads: 0.5, calves: 0.5, traps: 0.4 },
};
const qs = new URLSearchParams(location.search);
if (qs.has('bf')) state.bodyFatPct = +qs.get('bf');
if (qs.has('m')) for (const k in state.muscle) state.muscle[k] = +qs.get('m');

const ctl = document.getElementById('ctl');
const add = (sec) => { const d = document.createElement('div'); d.className = 'sec'; d.textContent = sec; ctl.appendChild(d); };
function slider(label, get, set, min, max, step) {
  const l = document.createElement('label');
  l.innerHTML = `<span>${label} <b></b></span><input type="range" min="${min}" max="${max}" step="${step}">`;
  const inp = l.querySelector('input'), b = l.querySelector('b');
  inp.value = get(); b.textContent = get();
  inp.addEventListener('input', () => { set(+inp.value); b.textContent = inp.value; push(); });
  ctl.appendChild(l);
}
add('Body fat');
slider('Body fat %', () => state.bodyFatPct, v => state.bodyFatPct = v, 6, 32, 0.5);
add('Muscle scores');
for (const k of Object.keys(state.muscle)) slider(k, () => state.muscle[k], v => state.muscle[k] = v, 0, 1, 0.05);
add('Measurements (in)');
const R = { neck: [12, 20], shoulders: [40, 60], chest: [34, 52], waist: [26, 46], hips: [32, 48], arm: [10, 20], forearm: [9, 15], thigh: [18, 30], calf: [12, 19], heightIn: [62, 78] };
for (const k of Object.keys(state.shape)) slider(k, () => state.shape[k], v => state.shape[k] = v, R[k][0], R[k][1], 0.25);

let ghostOn = false, auto = false, view;
const mount = document.getElementById('mount');
if (supported()) {
  view = mountBody3D(mount, { ...state, pose: qs.get('pose') || 'relaxed', height: 380 });
  window.viewer = view;
} else {
  document.getElementById('fallback').style.display = 'block';
  document.getElementById('fallback').innerHTML = silhouetteSVG(state.shape, { bodyFatPct: state.bodyFatPct });
}
function push() {
  if (!view) return;
  view.update({ shape: { ...state.shape }, muscle: { ...state.muscle }, bodyFatPct: state.bodyFatPct,
    compareShape: ghostOn ? { ...state.shape, waist: state.shape.waist + 3.5, chest: state.shape.chest - 0.5, arm: state.shape.arm - 1, bodyFatPct: state.bodyFatPct + 7 } : null });
}
window.setState = (s) => { Object.assign(state.shape, s.shape || {}); Object.assign(state.muscle, s.muscle || {}); if (s.bodyFatPct != null) state.bodyFatPct = s.bodyFatPct; if ('ghost' in s) ghostOn = s.ghost; push(); };
document.getElementById('ghost').onclick = () => { ghostOn = !ghostOn; push(); };
document.getElementById('auto').onclick = () => { auto = !auto; view && view.update({ autoRotate: auto }); };
for (const [id, yaw] of [['front', 0], ['q34', 0.7], ['side', 1.5708], ['back', Math.PI]]) document.getElementById(id).onclick = () => view && view._view({ yaw });
setInterval(() => { if (view) { const s = view.stats(); document.getElementById('stats').textContent = `fps ${s.fps} · scale ${s.scale.toFixed(2)} · last ${s.lastRenderMs}ms · buffer ${s.width}×${s.height}`; } }, 500);
</script>
</body>
</html>
